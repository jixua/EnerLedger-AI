  <body>
    <h1>企业天然气燃烧排放核算</h1>
    <p>天然气燃烧排放量可按活动数据乘以适用排放因子计算。</p>
    <p>活动数据应优先采用经过校验的计量数据，并保留原始凭证以支持结果追溯。</p>
    <p>核算时应明确报告边界和统计周期，将计量单位换算为排放因子要求的单位，再计算二氧化碳当量。</p>
    <p>数据处理过程应记录数据来源、排放因子版本、计算公式与复核结果，以便后续审计和差异分析。</p>
    <p>如果存在供应商结算单与现场仪表两类数据，应建立明确的取数优先级和异常数据处理规则。</p>
  </body>
