name: energy-carbon-rag

services:
  mysql:
    image: mysql:8.0.42
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql-root-local-change-me}
      MYSQL_DATABASE: ${DB_NAME:-tolink_rag_db}
      MYSQL_USER: ${DB_USER:-tolink}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tolink-local-change-me}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1
          -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio-local-change-me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio-local-change-me}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-tolink-rag-raw}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-tolink-rag-docs}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "local/$${MINIO_RAW_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_PRIVATE_BUCKET}"

  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # 9306 是业务代码使用的 MySQL wire/SQL 端口；9308 仅用于 HTTP 探活与诊断。
  manticore:
    image: manticoresearch/manticore:27.1.5
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${MANTICORE_SQL_PORT:-9306}:9306"
      - "${MANTICORE_HTTP_PORT:-9308}:9308"
    volumes:
      - manticore-data:/var/lib/manticore
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9308/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-energy-carbon}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-energy-carbon-local-change-me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-energy-carbon}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://tolink:tolink-local-change-me@mysql:3306/tolink_rag_db?charset=utf8mb4}
      ALEMBIC_DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://tolink:tolink-local-change-me@mysql:3306/tolink_rag_db?charset=utf8mb4}
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      MANTICORE_HOST: manticore
      MANTICORE_PORT: 9306
      PDF_PARSER_BACKEND: opendataloader
      PDF_PARSER_FALLBACKS: ""
      PDF_IMAGE_UPLOAD_ASYNC: "false"
      PARSE_TEMP_DIR: /tmp/energy-carbon-rag
      LOG_FILE_ENABLED: "false"
      NLTK_DATA: /app/nltk_data
      RECALL_LTR_MODE: "off"
      MQ_VENDOR: rabbitmq
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://energy-carbon:energy-carbon-local-change-me@rabbitmq:5672/energy-carbon}
      RABBITMQ_PREFETCH_COUNT: ${DOCUMENT_QUEUE_WORKER_CONCURRENCY:-1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      manticore:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # RabbitMQ basic_consume 主动投递；MySQL document 表仅保存状态、租约和幂等真值。
  parse-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 6m
    command: ["python", "-m", "app.workers.document_parse_worker"]
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://tolink:tolink-local-change-me@mysql:3306/tolink_rag_db?charset=utf8mb4}
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      MANTICORE_HOST: manticore
      MANTICORE_PORT: 9306
      PDF_PARSER_BACKEND: opendataloader
      PDF_PARSER_FALLBACKS: ""
      PDF_IMAGE_UPLOAD_ASYNC: "false"
      PARSE_TEMP_DIR: /tmp/energy-carbon-rag
      LOG_FILE_ENABLED: "false"
      NLTK_DATA: /app/nltk_data
      RECALL_LTR_MODE: "off"
      DOCUMENT_QUEUE_WORKER_CONCURRENCY: ${DOCUMENT_QUEUE_WORKER_CONCURRENCY:-1}
      MQ_VENDOR: rabbitmq
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://energy-carbon:energy-carbon-local-change-me@rabbitmq:5672/energy-carbon}
      RABBITMQ_PREFETCH_COUNT: ${DOCUMENT_QUEUE_WORKER_CONCURRENCY:-1}
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql-data:
  minio-data:
  qdrant-data:
  manticore-data:
  rabbitmq-data:
