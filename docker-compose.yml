name: energy-carbon-rag

services:
  mysql:
    image: mysql:8.0.42
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql-root-local-change-me}
      MYSQL_DATABASE: ${DB_NAME:-tolink_rag_db}
      MYSQL_USER: ${DB_USER:-tolink}
      MYSQL_PASSWORD: ${DB_PASSWORD:-tolink-local-change-me}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping -h 127.0.0.1
          -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minio-local-change-me}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minio-local-change-me}
      MINIO_RAW_BUCKET: ${MINIO_RAW_BUCKET:-tolink-rag-raw}
      MINIO_PRIVATE_BUCKET: ${MINIO_PRIVATE_BUCKET:-tolink-rag-docs}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing "local/$${MINIO_RAW_BUCKET}"
        mc mb --ignore-existing "local/$${MINIO_PRIVATE_BUCKET}"

  qdrant:
    image: qdrant/qdrant:v1.17.1
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # 9306 是业务代码使用的 MySQL wire/SQL 端口；9308 仅用于 HTTP 探活与诊断。
  manticore:
    image: manticoresearch/manticore:27.1.5
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${MANTICORE_SQL_PORT:-9306}:9306"
      - "${MANTICORE_HTTP_PORT:-9308}:9308"
    volumes:
      - manticore-data:/var/lib/manticore
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9308/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-energy-carbon}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-energy-carbon-local-change-me}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-energy-carbon}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  pi-agent:
    build:
      context: .
      dockerfile: deploy/jenkins/Dockerfile.pi
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      ENERLEDGER_BASE_URL: http://api:8000
      PI_SERVICE_HOST: 0.0.0.0
      PI_SERVICE_PORT: 8010
      PI_SERVICE_TOKEN: ${PI_SERVICE_TOKEN:-api-to-pi-local-token-000000000001}
      ENERLEDGER_INTERNAL_AGENT_TOKEN: ${ENERLEDGER_INTERNAL_AGENT_TOKEN:-pi-to-api-local-token-000000000001}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-120}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-30}
      REPORT_AGENT_INTERNAL_TOKEN: ${REPORT_AGENT_INTERNAL_TOKEN:-}
      REPORT_AGENT_TOOL_TIMEOUT_SECONDS: ${REPORT_AGENT_TOOL_TIMEOUT_SECONDS:-30}
      REPORT_AGENT_RUN_TIMEOUT_SECONDS: ${REPORT_AGENT_RUN_TIMEOUT_SECONDS:-600}
      REPORT_AGENT_MAX_TOOL_CALLS: ${REPORT_AGENT_MAX_TOOL_CALLS:-80}
      REPORT_MODEL_ALLOWED_HOSTS: ${REPORT_MODEL_ALLOWED_HOSTS:-}
      REPORT_MODEL_ALLOW_PRIVATE_ENDPOINTS: ${REPORT_MODEL_ALLOW_PRIVATE_ENDPOINTS:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://tolink:tolink-local-change-me@mysql:3306/tolink_rag_db?charset=utf8mb4}
      ALEMBIC_DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://tolink:tolink-local-change-me@mysql:3306/tolink_rag_db?charset=utf8mb4}
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      MANTICORE_HOST: manticore
      MANTICORE_PORT: 9306
      CHUNKING_STAGE_TWO_ALGORITHM: ${CHUNKING_STAGE_TWO_ALGORITHM:-semantic_depth_window}
      PDF_PARSER_BACKEND: ${PDF_PARSER_BACKEND:-opendataloader}
      PDF_PARSER_FALLBACKS: ${PDF_PARSER_FALLBACKS:-mineru}
      PDF_IMAGE_UPLOAD_ASYNC: "false"
      MINERU_API_URL: ${MINERU_API_URL:-https://mineru.net/api/v4/extract/task}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
      MINERU_TIMEOUT: ${MINERU_TIMEOUT:-900}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      PARSE_TEMP_DIR: /tmp/energy-carbon-rag
      LOG_FILE_ENABLED: "false"
      NLTK_DATA: /app/nltk_data
      RECALL_LTR_MODE: "off"
      MQ_VENDOR: rabbitmq
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://energy-carbon:energy-carbon-local-change-me@rabbitmq:5672/energy-carbon}
      RABBITMQ_PREFETCH_COUNT: ${DOCUMENT_QUEUE_WORKER_CONCURRENCY:-1}
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      PI_SERVICE_BASE_URL: http://pi-agent:8010
      PI_SERVICE_TOKEN: ${PI_SERVICE_TOKEN:-api-to-pi-local-token-000000000001}
      ENERLEDGER_INTERNAL_AGENT_TOKEN: ${ENERLEDGER_INTERNAL_AGENT_TOKEN:-pi-to-api-local-token-000000000001}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-120}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-30}
      PI_SERVICE_URL: http://pi-agent:8010
      REPORT_AGENT_INTERNAL_TOKEN: ${REPORT_AGENT_INTERNAL_TOKEN:-}
      REPORT_AGENT_RUN_TOKEN_SECRET: ${REPORT_AGENT_RUN_TOKEN_SECRET:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
      manticore:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pi-agent:
        condition: service_healthy

  # RabbitMQ basic_consume 主动投递；MySQL document 表仅保存状态、租约和幂等真值。
  parse-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 6m
    command: ["python", "-m", "app.workers.document_parse_worker"]
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://tolink:tolink-local-change-me@mysql:3306/tolink_rag_db?charset=utf8mb4}
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      MANTICORE_HOST: manticore
      MANTICORE_PORT: 9306
      CHUNKING_STAGE_TWO_ALGORITHM: ${CHUNKING_STAGE_TWO_ALGORITHM:-semantic_depth_window}
      PDF_PARSER_BACKEND: ${PDF_PARSER_BACKEND:-opendataloader}
      PDF_PARSER_FALLBACKS: ${PDF_PARSER_FALLBACKS:-mineru}
      PDF_IMAGE_UPLOAD_ASYNC: "false"
      MINERU_API_URL: ${MINERU_API_URL:-https://mineru.net/api/v4/extract/task}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
      MINERU_TIMEOUT: ${MINERU_TIMEOUT:-900}
      MINERU_MODEL_VERSION: ${MINERU_MODEL_VERSION:-vlm}
      PARSE_TEMP_DIR: /tmp/energy-carbon-rag
      LOG_FILE_ENABLED: "false"
      NLTK_DATA: /app/nltk_data
      RECALL_LTR_MODE: "off"
      DOCUMENT_QUEUE_WORKER_CONCURRENCY: ${DOCUMENT_QUEUE_WORKER_CONCURRENCY:-1}
      MQ_VENDOR: rabbitmq
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://energy-carbon:energy-carbon-local-change-me@rabbitmq:5672/energy-carbon}
      RABBITMQ_PREFETCH_COUNT: ${DOCUMENT_QUEUE_WORKER_CONCURRENCY:-1}
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  report-worker:
    profiles: ["reports"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 12m
    command: ["python", "-m", "app.workers.report_generation_worker"]
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://tolink:tolink-local-change-me@mysql:3306/tolink_rag_db?charset=utf8mb4}
      MQ_VENDOR: rabbitmq
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://energy-carbon:energy-carbon-local-change-me@rabbitmq:5672/energy-carbon}
      RABBITMQ_PREFETCH_COUNT: ${REPORT_QUEUE_WORKER_CONCURRENCY:-1}
      REPORT_PROCESSOR_MODE: pi
      PI_SERVICE_URL: http://pi-agent:8010
      PI_SERVICE_TOKEN: ${PI_SERVICE_TOKEN:-api-to-pi-local-token-000000000001}
      REPORT_AGENT_INTERNAL_TOKEN: ${REPORT_AGENT_INTERNAL_TOKEN:-}
      REPORT_AGENT_RUN_TOKEN_SECRET: ${REPORT_AGENT_RUN_TOKEN_SECRET:-}
      LOG_FILE_ENABLED: "false"
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      pi-agent:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql-data:
  minio-data:
  qdrant-data:
  manticore-data:
  rabbitmq-data:
