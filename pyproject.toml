[project]
name = "energy-carbon-rag"
version = "0.1.0"
description = "能碳会计 AI 智能体的文档解析与三路召回后端"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aio-pika>=9.4.0,<10.0.0",
  "beautifulsoup4>=4.12.0",
  "boto3>=1.34.0",
  "botocore>=1.34.0",
  "cryptography>=42.0.0",
  "defusedxml>=0.7.1,<1.0.0",
  "duckdb>=1.1.0,<2.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "infinity-sdk>=0.7.0",
  "jsonschema>=4.23.0,<5.0.0",
  "loguru>=0.7.0",
  "mammoth>=1.6.0",
  # NLTK 3.10 的 pathsec 会把 Docker Desktop 的 198.18/15 DNS 代理地址
  # 判为 SSRF 目标，导致镜像构建期无法下载固定语料；3.9 系列无此误判。
  "nltk>=3.9.0,<3.10.0",
  "numpy>=1.26.0",
  "openpyxl>=3.1.5,<4.0.0",
  "opencv-python-headless>=4.9.0",
  "opendataloader-pdf>=2.5.0",
  "pillow>=11.0.0,<13.0.0",
  "pydantic>=2.5.0",
  "pydantic-settings>=2.6.0",
  "pymupdf4llm>=1.27.2.2",
  "PyMuPDF>=1.23.0",
  "PyJWT>=2.8.0",
  "pymysql>=1.1.0",
  "aiomysql>=0.2.0",
  "alembic>=1.13.0",
  "python-docx>=1.1.0",
  "python-multipart>=0.0.12",
  "qdrant-client>=1.18.0,<1.19.0",
  "rapidocr>=3.9.0,<4.0.0",
  "redis>=5.0.0,<9.0.0",
  "SQLAlchemy[asyncio]>=2.0.0",
  "starlette>=0.36.3",
  "tiktoken>=0.7.0",
  "trafilatura>=2.0.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "PyYAML>=6.0.0",
  "reportlab>=4.0.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
