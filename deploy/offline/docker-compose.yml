name: ${COMPOSE_PROJECT_NAME:-enerledger-offline}

x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-production}
  DB_HOST: mysql
  DB_PORT: 3306
  DATABASE_URL: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}?charset=utf8mb4
  ALEMBIC_DATABASE_URL: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}?charset=utf8mb4
  STORAGE_TYPE: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
  QDRANT_URL: http://qdrant:6333
  QDRANT_HOST: qdrant
  QDRANT_PORT: 6333
  QDRANT_GRPC_PORT: 6334
  MANTICORE_HOST: manticore
  MANTICORE_PORT: 9306
  MQ_VENDOR: rabbitmq
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/${RABBITMQ_VHOST}
  PI_SERVICE_BASE_URL: http://pi-agent:8010
  PI_SERVICE_URL: http://pi-agent:8010
  LOG_FILE_ENABLED: "false"
  NLTK_DATA: /app/nltk_data

services:
  mysql:
    image: ${MYSQL_IMAGE}
    restart: unless-stopped
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: ${MINIO_IMAGE}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  qdrant:
    image: ${QDRANT_IMAGE}
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage

  manticore:
    image: ${MANTICORE_IMAGE}
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - manticore-data:/var/lib/manticore
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9308/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  rabbitmq:
    image: ${RABBITMQ_IMAGE}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  pi-agent:
    image: ${PI_AGENT_IMAGE}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      ENERLEDGER_BASE_URL: http://api:8000
      PI_SERVICE_HOST: 0.0.0.0
      PI_SERVICE_PORT: 8010
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      manticore:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      pi-agent:
        condition: service_healthy

  parse-worker:
    image: ${API_IMAGE}
    restart: unless-stopped
    stop_grace_period: 6m
    command: ["python", "-m", "app.workers.document_parse_worker"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  report-worker:
    profiles: ["reports"]
    image: ${API_IMAGE}
    restart: unless-stopped
    stop_grace_period: 12m
    command: ["python", "-m", "app.workers.report_generation_worker"]
    env_file:
      - path: .env
        required: false
    environment:
      <<: *api-environment
      REPORT_PROCESSOR_MODE: pi
    depends_on:
      api:
        condition: service_healthy
      pi-agent:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql-data:
    name: ${COMPOSE_PROJECT_NAME:-enerledger-offline}_mysql-data
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:-enerledger-offline}_minio-data
  qdrant-data:
    name: ${COMPOSE_PROJECT_NAME:-enerledger-offline}_qdrant-data
  manticore-data:
    name: ${COMPOSE_PROJECT_NAME:-enerledger-offline}_manticore-data
  rabbitmq-data:
    name: ${COMPOSE_PROJECT_NAME:-enerledger-offline}_rabbitmq-data
