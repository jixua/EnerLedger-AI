name: 质量检查

on:
  pull_request:
    branches:
      - dev
      - master
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 后端
    runs-on: ubuntu-24.04
    env:
      ADMIN_PASSWORD_HASH: scrypt:test-only
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: 安装 uv
        run: python -m pip install uv==0.11.14

      - name: 同步锁定依赖
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check app/api app/domain app/services app/main.py migrations tests

      - name: Pytest
        run: uv run pytest

  frontend:
    name: Web 前端
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装锁定依赖
        run: npm ci --prefix frontend --ignore-scripts

      - name: 前端测试
        run: npm --prefix frontend test

      - name: 生产构建
        run: npm --prefix frontend run build

  pi-agent:
    name: Pi Agent
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 安装 Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: third_party/pi/package-lock.json

      - name: 安装锁定依赖
        run: npm ci --prefix third_party/pi --ignore-scripts

      - name: 检查 Pi Agent
        run: npm run check:pi

  deployment-contract:
    name: 部署契约
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 校验 Compose
        env:
          PRODUCTION_ENV_FILE: .env.example
        run: >-
          docker compose
          --env-file deploy/production/.env.example
          -f deploy/production/docker-compose.yml
          config --quiet

      - name: 校验 Shell 脚本
        run: |
          for script in deploy/production/scripts/*.sh; do
            bash -n "$script"
          done

      - name: 确认生产占位口令会被拒绝
        run: |
          if bash deploy/production/scripts/validate-env.sh \
            deploy/production/.env.example >/dev/null 2>&1; then
            echo "Production environment template must not pass as a real secret file" >&2
            exit 1
          fi
